<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senhas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="password-container">
        <h2>Gerador de senhas aleatorias</h2>
        <div class="input-container">
            <input type="text" id="input" class="input" placeholder="Criar nova senha" readonly />
            <i class="fa-solid fa-copy fa-2x"></i>
        </div>
        <button class="btn">Gerar</button>
    </div>
    <div class="alert-container active">Senha Copiada</div>
    <script src="script.js"></script>
</body>

</html>
